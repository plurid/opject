[tool.uv]
required-version = ">=0.11.3"

[tool.uv.workspace]
members = ["packages/python/*"]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.15,<0.16",
    "twine>=7,<8",
]

[tool.pytest.ini_options]
testpaths = ["packages/python"]
addopts = ["--import-mode=importlib", "-ra"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
