[build-system]
requires = ["hatchling>=1.32.3,<2"]
build-backend = "hatchling.build"

[project]
name = "opject-server"
version = "0.0.0"
description = "Server for object passing"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-delicense"
license-files = ["LICENSE", "LICENSE.deon"]
authors = [{ name = "ly3xqhl8g9", email = "ly3xqhl8g9@plurid.com" }]
dependencies = ["flask>=3.1,<4", "flask-classful>=0.16,<1"]

[project.urls]
Repository = "https://github.com/plurid/opject"
Issues = "https://github.com/plurid/opject/issues"

[tool.hatch.build.targets.wheel]
packages = ["opject_server"]
